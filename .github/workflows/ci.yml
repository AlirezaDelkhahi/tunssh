name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Build & Test (Linux + Windows Cross-Check)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev pkg-config

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Run Go tests
        run: go test -race -count=1 ./...

      - name: Run Go vet and script checks
        run: |
          bash -n packaging/fetch-wintun.sh
          go vet ./internal/...
          go vet -tags webkit2_41 ./...

      - name: Build Linux binary
        run: |
          mkdir -p bin
          go build -tags "desktop,production,webkit2_41" -ldflags="-s -w" -o bin/tunssh ./cmd/tunssh

      - name: Cross-compile check Windows (amd64 & arm64)
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./internal/...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags "desktop,production" -ldflags="-s -w -H windowsgui" -o /tmp/tunssh-amd64.exe ./cmd/tunssh
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build ./internal/...
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -tags "desktop,production" -ldflags="-s -w -H windowsgui" -o /tmp/tunssh-arm64.exe ./cmd/tunssh
