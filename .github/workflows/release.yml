name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (optional, e.g. 0.1.0; defaults to tag or 0.0.0-<sha>)"
        required: false
        type: string
      include_windows:
        description: "Build Windows archives"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev pkg-config

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            raw="$INPUT_VERSION"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            raw="${GITHUB_REF_NAME}"
          else
            raw="0.0.0-${GITHUB_SHA::7}"
          fi
          clean="${raw#v}"
          echo "version=${clean}" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Linux binary
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          go build -tags "desktop,production,webkit2_41" -ldflags="-s -w" -o bin/tunssh ./cmd/tunssh

      - name: Package Linux artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          stage_dir="$(mktemp -d)"
          trap 'rm -rf "$stage_dir"' EXIT
          cp bin/tunssh "$stage_dir/tunssh"
          cp packaging/tunssh.desktop "$stage_dir/tunssh.desktop"
          cp packaging/tunssh.svg "$stage_dir/tunssh.svg"
          tar -C "$stage_dir" -czf "dist/tunssh-${VERSION}-linux-${GOARCH}.tar.gz" tunssh tunssh.desktop tunssh.svg
          for pkg in deb rpm archlinux; do
            nfpm package -f packaging/nfpm.yaml -p "$pkg" -t dist/
          done

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: Build Windows (${{ matrix.goarch }})
    if: ${{ inputs.include_windows == true }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        goarch:
          - amd64
          - arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            raw="$INPUT_VERSION"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            raw="${GITHUB_REF_NAME}"
          else
            raw="0.0.0-${GITHUB_SHA::7}"
          fi
          clean="${raw#v}"
          echo "version=${clean}" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build and package Windows binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin dist
          ./packaging/fetch-wintun.sh "$GOARCH" bin
          GOOS=windows GOARCH="$GOARCH" CGO_ENABLED=0 go build -tags "desktop,production" -ldflags="-s -w -H windowsgui" -o bin/tunssh.exe ./cmd/tunssh
          (cd bin && zip -q "../dist/tunssh-${VERSION}-windows-${GOARCH}.zip" tunssh.exe wintun.dll)

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.goarch }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Create Release Bundle
    needs:
      - build-linux
      - build-windows
    if: ${{ !cancelled() && needs.build-linux.result == 'success' && (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') }}
    runs-on: ubuntu-24.04

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: |
          rm -f SHA256SUMS.txt
          sha256sum * > /tmp/SHA256SUMS.txt
          mv /tmp/SHA256SUMS.txt SHA256SUMS.txt

      - name: Upload combined release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release-assets/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
