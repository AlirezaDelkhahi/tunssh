name: tunssh
arch: ${GOARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: AlirezaDelkhahi
description: Minimalist 1-click SSH desktop tunnel client (System Proxy & Full TUN)
homepage: https://github.com/AlirezaDelkhahi/tunssh
license: MIT

contents:
  - src: ${BIN_PATH}
    dst: /usr/bin/tunssh
    file_info:
      mode: 0755
  - src: packaging/tunssh.desktop
    dst: /usr/share/applications/tunssh.desktop
    file_info:
      mode: 0644
  - src: packaging/tunssh.svg
    dst: /usr/share/icons/hicolor/scalable/apps/tunssh.svg
    file_info:
      mode: 0644

overrides:
  deb:
    depends:
      - libgtk-3-0t64 | libgtk-3-0
      - libwebkit2gtk-4.1-0
      - libsecret-1-0
    recommends:
      - libayatana-appindicator3-1
      - polkitd | policykit-1
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
      - libsecret
    recommends:
      - libayatana-appindicator-gtk3
      - polkit
  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1
      - libsecret
    recommends:
      - libayatana-appindicator
      - polkit
